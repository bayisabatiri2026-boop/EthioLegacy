name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build App
        run: |
          # 1. Create the www folder and copy your files
          mkdir -p www
          cp index.html www/ || true
          cp logo.png www/ || true
          cp manifest.webmanifest www/ || true
          cp -r icons www/ || true
          
          # 2. Remove conflicting files that cause GitHub to crash
          rm -f package.json package-lock.json capacitor.config.ts
          
          # 3. Install Capacitor 7 and plugins
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install --legacy-peer-deps @capacitor/camera@7 @capacitor-community/contacts@latest @capacitor/local-notifications@7 @capacitor/push-notifications@7 @capacitor-community/biometric-auth@latest
          
          # 4. Create the JSON config (Splash screen settings added)
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1000,
                "backgroundColor": "#6f172c"
              }
            }
          }
          EOF
          
          # 5. Build Android Project
          rm -rf android
          npx cap add android
          # 6. Force Replace App Icon and Splash Screen
          if [ -f "logo.png" ]; then
          sudo apt-get update && sudo apt-get install -y imagemagick
  
          # 1. Delete the default Capacitor adaptive icon files that block changes
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          # 2. Generate perfect App Icons (forced square, white background just in case)
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # 3. Generate perfect Round App Icons
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert logo.png -background "#ffffff" -gravity center -extent 1:1 -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          # 4. Generate Splash Screens (keeps your maroon background)
          convert logo.png -background "#6f172c" -gravity center -extent 1:1 android/app/src/main/res/drawable/splash.png || true
          cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-mdpi/splash.png || true
          cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-hdpi/splash.png || true
          cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-xhdpi/splash.png || true
          cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-xxhdpi/splash.png || true
          cp android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable-xxxhdpi/splash.png || true
          fi
          # 7. Copy your custom AndroidManifest if it exists
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          # 8. Sync plugins and web files
          npx cap sync android
          
          # 9. Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
