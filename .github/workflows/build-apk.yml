name: Build EthioLegacy Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'android/' \
            --exclude 'www/'

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install --save-exact @capacitor/core@6.2.1
          npm install --save-dev --save-exact @capacitor/cli@6.2.1
          npm install --save-exact @capacitor/android@6.2.1
          npm install -D typescript@5
          npm install --save @capacitor-community/contacts@6

          cat > capacitor.config.json << EOF
          {
            "appId": "com.ethiolegacy.app",
            "appName": "EthioLegacy",
            "webDir": "www"
          }
          EOF
          
          rm -f capacitor.config.ts
          npx cap add android
          npx cap sync

      - name: FORCE Logo and Permissions
        run: |
          # 1. ADD PERMISSIONS
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.WRITE_CONTACTS" />' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          
          # 2. OVERWRITE THE LOGO (Safer than deleting)
          echo "Overwriting default icons with logo.png..."
          
          # Check if logo.png exists first to prevent crashing
          if [ -f logo.png ]; then
            find android/app/src/main/res -type d -name "mipmap-*" | while read dir; do
              # Overwrite the existing files. If they don't exist, it just copies them.
              cp -f logo.png "$dir/ic_launcher.png" 2>/dev/null || true
            done
          else
            echo "WARNING: logo.png not found! Check if the file name is exactly logo.png in the main folder."
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
