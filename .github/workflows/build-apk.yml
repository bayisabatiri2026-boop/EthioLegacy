name: Build EthioLegacy Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e
          
          # 1. Copy web files
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'android/' \
            --exclude 'www/'

          # 2. Setup npm
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # 3. Install Capacitor and fixed TypeScript version
          npm install --save-exact @capacitor/core@6.2.1
          npm install --save-dev --save-exact @capacitor/cli@6.2.1
          npm install --save-exact @capacitor/android@6.2.1
          npm install -D typescript@5

          # 4. Create JS Config (Prevents the CLI parsing crash)
          cat > capacitor.config.json << EOF
          {
            "appId": "com.ethiolegacy.app",
            "appName": "EthioLegacy",
            "webDir": "www"
          }
          EOF
          
          # Remove .ts config if it exists to avoid conflicts
          rm -f capacitor.config.ts

          # 5. Add Android and sync
          npx cap add android
          npx cap sync

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
