name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # FIX: Changed Java version to 21 for Capacitor 7
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build App
        run: |
          # 1. Create the www folder and copy your files
          mkdir -p www
          cp index.html www/ || true
          cp logo.png www/ || true
          cp manifest.webmanifest www/ || true
          cp -r icons www/ || true
          
          # 2. Remove conflicting files that cause GitHub to crash
          rm -f package.json package-lock.json capacitor.config.ts
          
          # 3. Install Capacitor 7 and plugins
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install --legacy-peer-deps @capacitor/camera@7 @capacitor-community/contacts@latest @capacitor/local-notifications@7 @capacitor/push-notifications@7
          
          # 4. Create the JSON config
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          
          # 5. Build Android Project
          rm -rf android
          npx cap add android
          
          # 6. Copy your custom AndroidManifest if it exists in your root
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          npx cap sync android
          
          # 7. Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
