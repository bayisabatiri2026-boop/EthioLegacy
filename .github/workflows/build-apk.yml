name: Build EthioLegacy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e

          mkdir -p www

          # 1. Copy ONLY the web files to www
          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'android/' \
            --exclude 'www/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json'

          # 2. Force install Capacitor 7 and plugins, completely ignoring the repo's package.json
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/camera@7 @capacitor-community/contacts@latest @capacitor/local-notifications@7 @capacitor/push-notifications@7

          # 3. Create Capacitor configuration
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # 4. Regenerate Android project
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EthioLegacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
