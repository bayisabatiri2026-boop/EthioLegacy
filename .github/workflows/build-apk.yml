name: Build EthioLegacy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e

          mkdir -p www

          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'android/' \
            --exclude 'www/'

          # 1. Install Capacitor core at a known version, then matching plugins
                npm install --no-audit --no-fund
                 npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3 @capacitor/cli@7.4.3
                  npm install @capacitor/camera@latest-7 @capacitor-community/contacts@latest-7 @capacitor/local-notifications@latest-7 @capacitor/push-notifications@latest-7

          # 2. Create Capacitor configuration with HTTPS scheme
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "plugins": {
              "PushNotifications": {
                "presentationOptions": ["badge", "sound", "alert"]
              },
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon",
                "iconColor": "#008069"
              }
            }
          }
          EOF

          rm -f capacitor.config.ts

          # 3. Create Android project if it does not exist
          if [ ! -d android ]; then
            npx cap add android
          fi

          # 4. Synchronize application and native plugins
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EthioLegacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
