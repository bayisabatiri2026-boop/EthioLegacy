name: Build EthioLegacy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e

          # 1. Safely create the www folder and copy ONLY your html, js, css files
          mkdir -p www
          cp -r *.html *.js *.css *.png *.svg *.json www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true

          # 2. Clean out the old packages so they don't conflict
          rm -f package.json package-lock.json

          # 3. Create a fresh package environment
          npm init -y

          # 4. Install the perfectly matched Capacitor 7 packages
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install --legacy-peer-deps @capacitor/camera@7 @capacitor-community/contacts@latest @capacitor/local-notifications@7 @capacitor/push-notifications@7

          # 5. Create Capacitor configuration
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          # 6. Build the Android app
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EthioLegacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
