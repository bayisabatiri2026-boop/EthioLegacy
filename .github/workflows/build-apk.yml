name: Build EthioLegacy Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EthioLegacy
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          set -e

          mkdir -p www

          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude 'android/' \
            --exclude 'www/'

          # Install exact versions from package.json
          npm install --no-audit --no-fund

          # Verify Capacitor versions
          npm ls @capacitor/core @capacitor/android @capacitor/cli

          # Create Capacitor configuration
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www"
          }
          EOF

          rm -f capacitor.config.ts

          # Create Android project if it does not exist
          if [ ! -d android ]; then
            npx cap add android
          fi

          # Synchronize application
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EthioLegacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
