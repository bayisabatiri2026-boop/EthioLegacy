name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build App
        run: |
          # 1. Create the www folder and copy your files
          mkdir -p www
          cp index.html www/ || true
          cp logo.png www/ || true
          cp manifest.webmanifest www/ || true
          cp -r icons www/ || true
          
          # 2. Remove conflicting files that cause GitHub to crash
          rm -f package.json package-lock.json capacitor.config.ts
          
          # 3. Install Capacitor 7 and plugins
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install --legacy-peer-deps @capacitor/camera@7 @capacitor-community/contacts@latest @capacitor/local-notifications@7 @capacitor/push-notifications@7
          
          # 4. Create the JSON config (Splash screen settings added)
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.ethiolegacy.chat",
            "appName": "EthioLegacy",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1000,
                "backgroundColor": "#6f172c"
              }
            }
          }
          EOF
          
          # 5. Build Android Project
          rm -rf android
          npx cap add android
          
          # 6. Replace Capacitor default splash screen with your logo
           if [ -f "logo.png" ]; then
          cp logo.png android/app/src/main/res/drawable/splash.png || true
          cp logo.png android/app/src/main/res/drawable-mdpi/splash.png || true
          cp logo.png android/app/src/main/res/drawable-hdpi/splash.png || true
          cp logo.png android/app/src/main/res/drawable-xhdpi/splash.png || true
          cp logo.png android/app/src/main/res/drawable-xxhdpi/splash.png || true
          cp logo.png android/app/src/main/res/drawable-xxxhdpi/splash.png || true
          fi
          
          # 7. Copy your custom AndroidManifest if it exists
          if [ -f "AndroidManifest.xml" ]; then
            cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          # 8. Sync plugins and web files
          npx cap sync android
          
          # 9. Build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
