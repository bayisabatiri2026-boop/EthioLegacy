name: Build EthioLegacy Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor versions
        run: npm ls @capacitor/core @capacitor/android @capacitor/cli

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Install EthioLegacy native Android files
        run: |
          mkdir -p android/app/src/main/java/com/ethiolegacy/app
          cp native/android/app/src/main/java/com/ethiolegacy/app/*.java android/app/src/main/java/com/ethiolegacy/app/
          cp native/android/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R native/android/app/src/main/res/. android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EthioLegacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
